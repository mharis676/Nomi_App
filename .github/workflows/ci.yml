name: Build Android APK
run-name: APK build ${{ github.run_number }} (${{ github.event_name }})
"on":
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nomi-android-apk
  cancel-in-progress: true
jobs:
  apk:
    name: Build APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DATA_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install dependencies
        run: npm ci
      - name: Build and sync Android app
        run: npm run android:sync
      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Latest Android APK Build"
          body: "Local-storage Android APK. Build ${{ github.run_number }}, commit ${{ github.sha }}."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
