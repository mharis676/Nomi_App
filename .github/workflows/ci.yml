name: Quality checks
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            playwright-local-report/
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa_admin
          POSTGRES_PASSWORD: qa_password
          POSTGRES_DB: carry_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa_admin -d carry_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qa_admin:qa_password@localhost:5432/carry_qa
      TEST_DATABASE_URL: postgresql://qa_admin:qa_password@localhost:5432/carry_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f test/integration/bootstrap.sql
      - run: npm run db:migrate
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/runtime-role.sql
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-browser-report
          path: playwright-server-report/
          retention-days: 14
